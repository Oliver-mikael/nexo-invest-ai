[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# La URL real la inyecta migrations/env.py desde la configuración de la app
# (DATABASE_URL o NEXO_DATABASE_URL). Este valor solo evita que Alembic falle
# cuando se inspecciona el fichero sin entorno.
sqlalchemy.url = sqlite:///./var/nexo.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
