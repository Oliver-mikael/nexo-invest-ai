services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    image: ${NEXO_VALIDATION_IMAGE:-nexo-invest-ai:validation}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
      NEXO_ENV: production
      NEXO_AUTO_CREATE_SCHEMA: "0"
      NEXO_ALLOW_REGISTRATION: "false"
      NEXO_CORS_ORIGINS: ${NEXO_CORS_ORIGINS:-}
      NEXO_SEC_CONTACT: smoke@nexo.invalid
      NEXO_DOCUMENTS_DIR: /app/var/documents
      NEXO_MAX_REQUEST_BODY_BYTES: "64"
    ports:
      - "127.0.0.1::8000"
    volumes:
      - documents:/app/var/documents
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  database:
  documents: