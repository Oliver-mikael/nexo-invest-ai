[project]
name = "nexo-invest-ai"
version = "0.3.0"
description = "Motor de investigación y valoración de inversiones verificable."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Nexo Invest AI", email = "dev@nexoinvest.ai"}
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
# Sin dependencias de ejecución: el proyecto usa solo la biblioteca estándar.
dependencies = []

[project.optional-dependencies]
# Backend de la plataforma (API, IA, persistencia). El motor no las necesita.
api = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.3.0",
    "fastapi>=0.115,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "httpx>=0.27,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
nexo = "nexo_invest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexo_invest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
# Reglas de error y de importación: las que detectan defectos reales.
select = ["E4", "E7", "E9", "F", "W"]
